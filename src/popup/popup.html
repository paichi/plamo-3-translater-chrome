<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PLaMo 翻訳</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>PLaMo 翻訳</h1>
  <p id="status">確認中…</p>
  <button type="button" id="toggle" disabled>このページを翻訳</button>

  <p><button type="button" id="exclude-site" class="link" disabled>このサイトでは自動翻訳しない</button></p>
  <button type="button" id="options" class="link">設定を開く</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
